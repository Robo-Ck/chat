<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1 class="header">RoboChat</h1>
        <ul id="messages">
            <li>Test message</li>
            <li>Hello! Test message 2</li>
        </ul>

        <form id="form">
            <input type="text" name="message" id="input" placeholder="Enter message...">
            <input type="submit" value="Send" class="submit">
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
